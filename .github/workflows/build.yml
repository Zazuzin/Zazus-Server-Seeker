name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - minecraft: "26.2"
            path: .
          - minecraft: "26.3"
            path: versions/mc26.3
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Test VIP player-search protocol and access boundaries
        working-directory: ${{ matrix.path }}
        run: bash tools/test_player_search.sh

      - name: Build verified JAR
        working-directory: ${{ matrix.path }}
        run: ./build.sh

      - name: Audit real native ping hook APIs
        working-directory: ${{ matrix.path }}
        run: python3 tools/discovery_native_audit.py

      - name: Test detailed filters and ping history
        working-directory: ${{ matrix.path }}
        run: bash tools/test_discovery_enhancements.sh

      - name: Test in-game API-key persistence
        working-directory: ${{ matrix.path }}
        run: bash tools/test_api_key_settings.sh

      - name: Run regression suite
        working-directory: ${{ matrix.path }}
        run: ./verify.sh

      - name: Run compatibility suite
        working-directory: ${{ matrix.path }}
        run: ./release_compatibility_tests.sh

      - name: Upload verified JAR
        uses: actions/upload-artifact@v7
        with:
          name: zazus-server-seeker-mc${{ matrix.minecraft }}
          path: ${{ matrix.path }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
