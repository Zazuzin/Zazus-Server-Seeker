name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - minecraft: "26.2"
            path: .
          - minecraft: "26.3"
            path: versions/mc26.3
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Inspect native EditBox API
        run: |
          python3 - <<'PYAPI'
          import os, pathlib, zipfile, subprocess
          paths=subprocess.check_output(['rg','--files',os.environ['GRADLE_USER_HOME']+'/caches','-g','*.jar'],text=True).splitlines()
          found=0
          for path in paths:
              try:
                  with zipfile.ZipFile(path) as jar:
                      present='net/minecraft/client/gui/components/EditBox.class' in jar.namelist()
                  if present:
                      print('EDITBOX API:',path,flush=True)
                      subprocess.run(['javap','-p','-classpath',path,'net.minecraft.client.gui.components.EditBox'],check=True)
                      found+=1
                      if found>=2: break
              except zipfile.BadZipFile:
                  pass
          PYAPI

      - name: Test VIP player-search protocol and access boundaries
        working-directory: ${{ matrix.path }}
        run: bash tools/test_player_search.sh

      - name: Build verified JAR
        working-directory: ${{ matrix.path }}
        run: ./build.sh

      - name: Test in-game API-key persistence
        working-directory: ${{ matrix.path }}
        run: bash tools/test_api_key_settings.sh

      - name: Run regression suite
        working-directory: ${{ matrix.path }}
        run: ./verify.sh

      - name: Run compatibility suite
        working-directory: ${{ matrix.path }}
        run: ./release_compatibility_tests.sh

      - name: Upload verified JAR
        uses: actions/upload-artifact@v7
        with:
          name: zazus-server-seeker-mc${{ matrix.minecraft }}
          path: ${{ matrix.path }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
