name: Apply v0.3.34 source

on:
  push:
    branches: [ main ]
    paths:
      - '.upload-v034/READY'

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload-v034/source.tar.gz.b64.* > /tmp/zst-source.b64
          base64 -d /tmp/zst-source.b64 > /tmp/zst-source.tar.gz
          echo '651dba2fb10b79c8a7b87e15ac1003ff4eef1052ec12f5a8c493dde5cad1182a  /tmp/zst-source.tar.gz' | sha256sum -c -
          rm -rf /tmp/zst-src
          mkdir -p /tmp/zst-src
          tar -xzf /tmp/zst-source.tar.gz -C /tmp/zst-src
          cp -a /tmp/zst-src/Zazus-Server-Tool-0.3.34-full-source/. .
          rm -rf .upload-v034

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh
          ./verify.sh

      - name: Commit v0.3.34 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Update source to v0.3.34 multiplayer fixes'
          git push origin main
