name: Release v1.2.2 for Minecraft 26.2 and 26.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.2.2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.2.2
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Zazuzin/Zazus-Server-Seeker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Build and fully verify Minecraft 26.2
        run: |
          set -euo pipefail
          bash tools/test_player_search.sh
          ./build.sh
          python3 tools/discovery_native_audit.py
          bash tools/test_discovery_enhancements.sh
          bash tools/test_api_key_settings.sh
          ./verify.sh
          ./release_compatibility_tests.sh

      - name: Build and fully verify Minecraft 26.3
        working-directory: versions/mc26.3
        run: |
          set -euo pipefail
          bash tools/test_player_search.sh
          ./build.sh
          python3 tools/discovery_native_audit.py
          bash tools/test_discovery_enhancements.sh
          bash tools/test_api_key_settings.sh
          ./verify.sh
          ./release_compatibility_tests.sh

      - name: Prepare verified downloads and complete source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import zipfile
          for mc, root in [('26.2', Path('.')), ('26.3', Path('versions/mc26.3'))]:
              jar = root / f'build/libs/Zazus-Server-Seeker-1.2.2-mc{mc}.jar'
              with zipfile.ZipFile(jar) as archive:
                  assert archive.testzip() is None
                  metadata = json.loads(archive.read('fabric.mod.json'))
                  assert metadata['version'] == '1.2.2'
                  assert metadata['depends']['minecraft'] == '~' + mc
          PY
          mkdir -p release-dist
          cp build/libs/Zazus-Server-Seeker-1.2.2-mc26.2.jar release-dist/
          cp versions/mc26.3/build/libs/Zazus-Server-Seeker-1.2.2-mc26.3.jar release-dist/
          git archive --format=zip --prefix=Zazus-Server-Seeker-1.2.2/ \
            --output=release-dist/Zazus-Server-Seeker-1.2.2-Complete-Source.zip HEAD
          cd release-dist
          sha256sum *.jar *-Complete-Source.zip > Zazus-Server-Seeker-1.2.2-SHA256SUMS.txt

      - name: Publish v1.2.2 after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.2.2
          if gh release view "$tag" --json isDraft --repo "$GITHUB_REPOSITORY" > release-state.json 2>/dev/null; then
            if ! python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"]'; then
              echo "v1.2.2 is already published; preserving its existing downloads."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Zazu's Server Seeker v1.2.2" --notes-file RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$tag" release-dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --draft=false --latest \
            --title "Zazu's Server Seeker v1.2.2" --notes-file RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY"
